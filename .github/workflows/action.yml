name: Action

on:
  push:
    branches: [main]
  pull_request:

jobs:
  self-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - id: site
        run: |
          node tests/helpers/serve.ts > "$RUNNER_TEMP/origins" &
          timeout 30 bash -c 'until grep -q "^right=" "$0"; do sleep 1; done' "$RUNNER_TEMP/origins"
          cat "$RUNNER_TEMP/origins" >> "$GITHUB_OUTPUT"

      - id: clean
        uses: ./
        with:
          left: ${{ steps.site.outputs.left }}
          right: ${{ steps.site.outputs.right }}
          routes: / /flex-vs-grid
          widths: 1440,375
          threshold: "0.999"
          artifact-name: clean

      - id: differ
        continue-on-error: true
        uses: ./
        with:
          left: ${{ steps.site.outputs.left }}
          right: ${{ steps.site.outputs.right }}
          routes: |
            /color
            /tint
          widths: "1440"
          threshold: "0.999"
          out: differ-out
          artifact-name: differ

      - id: accept
        uses: ./
        with:
          left: ${{ steps.site.outputs.left }}
          right: ${{ steps.site.outputs.right }}
          routes: /color
          widths: "1440"
          accept: self-test
          out: accept-out
          artifact-name: accept

      - id: down
        continue-on-error: true
        uses: ./
        with:
          left: http://127.0.0.1:9
          right: ${{ steps.site.outputs.right }}
          routes: /
          wait-timeout: "1"
          artifact-name: down

      - env:
          DOWN: ${{ steps.down.outputs.exit-code }}
          CLEAN: ${{ steps.clean.outputs.exit-code }}
          DIFFER: ${{ steps.differ.outputs.exit-code }}
          OUTCOME: ${{ steps.differ.outcome }}
        run: |
          test "$CLEAN" = 0
          test "$DIFFER" = 1
          test "$OUTCOME" = failure
          test "$DOWN" = 2
          node -e 'const r = require("./differ-out/results.json").results; for (const p of ["/color", "/tint"]) if (!(r.find((x) => x.url === p)?.score < 0.999)) throw p'
          grep -q '"/color"' accept-out/renderdiff.accepted.json
