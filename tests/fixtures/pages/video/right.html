<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Video guard rail</title>
<link rel="stylesheet" href="/shared/base.css">
<style>
/* GUARD RAIL for video freezing. The same autoplaying, script-played and late-inserted videos on
   both sides; the fixture server delays the right side's video, so without freezing one side
   shows the poster while the other plays. Frozen, both stay on frame 0. */
video { display: block; width: 640px; height: 360px; margin-top: var(--gap); }
</style>
</head>
<body>
<div class="page">
<h1>Video guard rail</h1>
<p class="lede">An autoplaying video, one started from script and one inserted after load. Each has a poster, and the clip loads later on one side than the other, so a run that let them play would compare different frames.</p>
<video autoplay muted loop poster="/shared/img/azure.svg" src="/shared/video/clip.webm"></video>
<video id="played" muted loop poster="/shared/img/moss.svg" src="/shared/video/clip.webm"></video>
<script>document.getElementById("played").play();</script>
<div id="late"></div>
<script>
setTimeout(() => {
  document.getElementById("late").innerHTML =
    '<video autoplay muted loop poster="/shared/img/slate.svg" src="/shared/video/clip.webm"></video>';
}, 100);
</script>
</div>
</body>
</html>
