<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Layout parity</title>
<link rel="stylesheet" href="/shared/base.css">
<style>
/* GUARD RAIL for page-shot height: an app shell, where body scrolls and html is the
   viewport's height. Everything below the fold must still be shot. */
html { overflow: hidden; height: 100%; }
body { height: 100%; overflow: auto; }
.tall { height: 3000px; }
</style>
</head>
<body>
<div class="page">
<h1>App shell</h1>
<section class="notes">
<h2>Notes</h2>
<p>The html element is exactly the viewport's height and hides its overflow, while the body scrolls its own 3,000px of content. The shot must keep all of it, not just the first screen it opens on.</p>
</section>
<div class="tall"></div>
</div>
</body>
</html>
