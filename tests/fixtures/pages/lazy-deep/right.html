<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Layout parity</title>
<link rel="stylesheet" href="/shared/base.css">
<style>
/* GUARD RAIL for native lazy loading far below the fold. The images sit under a 4,800px
   spacer, well past Chromium's lazy-load margin, so they only load if the capture makes
   them eager. This side is lazy and the right side eager; the asymmetry is the test. */
.spacer { height: 4800px; margin: 0 0 32px; background: var(--fill); border: 1px solid var(--line); }
.gallery { display: flex; flex-direction: column; gap: var(--gap); }
</style>
</head>
<body>
<div class="page">
<h1>Deep lazy images guard rail</h1>
<p class="lede">Four images more than four thousand pixels below the fold, loaded lazily on this side and eagerly on the other.</p>

<div class="spacer"></div>
<div class="gallery">
  <img class="shot" src="/shared/img/slate.svg" alt="slate">
  <img class="shot" src="/shared/img/azure.svg" alt="azure">
  <img class="shot" src="/shared/img/moss.svg" alt="moss">
  <img class="shot" src="/shared/img/slate.svg" alt="slate">
</div>

<section class="notes">
<h2>Notes</h2>
<p>Parity here means every image was fetched and decoded before the shot, however the page chose to defer it.</p>
</section>
</div>
</body>
</html>
