<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Layout parity</title>
<link rel="stylesheet" href="/shared/base.css">
<style>
/* GUARD RAIL for page-shot width: the right side parks a box off-canvas behind overflow-x.
   Both sides outgrow the viewport, so both take the same capture path. */
.tall { height: 1200px; }
</style>
</head>
<body>
<div class="page">
<h1>Off canvas</h1>
<section class="notes">
<h2>Notes</h2>
<p>The right side parks a box just past the right edge and hides it with overflow-x on the body. Nobody can scroll to it, so the shot must stay as wide as the viewport, and both sides must match pixel for pixel.</p>
</section>
<div class="tall"></div>
</div>
</body>
</html>
