name: renderdiff visual parity
description: Screenshot-diff a preview or local build against production and fail the job on a visual change.
author: Timur Mashara
branding:
  icon: eye
  color: purple

inputs:
  left:
    description: Your change, e.g. the preview deployment URL or http://localhost:3000.
    required: true
  right:
    description: The reference, e.g. https://example.com.
    required: true
  routes:
    description: Routes separated by spaces or newlines, e.g. "/ /about /pricing::/plans". Optional when the config lists them.
    default: ""
  config:
    description: Path to a renderdiff config file. Default renderdiff.config.{ts,mts,js,mjs} in the workspace.
    default: ""
  widths:
    description: Viewport widths separated by spaces or commas. Default renderdiff's five.
    default: ""
  threshold:
    description: Fail only when a comparison scores below this (0..1). Without it any difference fails the job; 0 never fails on one.
    default: ""
  concurrency:
    description: Parallel workers, which is also the most loads production sees at once. Default half the cores, 2 to 8 (2 on a hosted runner).
    default: ""
  storage-state:
    description: Contents of a Playwright storage-state JSON for both sides, from a secret. Written to a 0600 temp file, deleted after the run.
    default: ""
  accept:
    description: Record this run's differences as accepted, with this reason. Commit the renderdiff.accepted.json from the artifact.
    default: ""
  wait-timeout:
    description: Whole seconds to wait for left to answer (any status under 500) before running. Past it, exit-code is 2.
    default: "300"
  out:
    description: Output directory. Overrides the config's outDir.
    default: renderdiff-out
  artifact-name:
    description: Name of the uploaded artifact with the report, results.json and crops.
    default: renderdiff

outputs:
  exit-code:
    description: renderdiff's exit code. 0 pass, 1 a difference (or below threshold), 2 bad input or origin down, 3 a route errored.
    value: ${{ steps.run.outputs.exit-code }}
  results:
    description: Path to results.json.
    value: ${{ steps.run.outputs.results }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v5
      with:
        node-version: 24
        package-manager-cache: false

    - id: pw
      shell: bash
      working-directory: ${{ github.action_path }}
      run: echo "version=$(node -p 'require("./package-lock.json").packages["node_modules/playwright"].version')" >> "$GITHUB_OUTPUT"

    - uses: actions/cache@v4
      with:
        path: ${{ runner.tool_cache }}/renderdiff-ms-playwright
        key: renderdiff-chromium-${{ runner.os }}-${{ runner.arch }}-${{ steps.pw.outputs.version }}

    - shell: bash
      working-directory: ${{ github.action_path }}
      env:
        PLAYWRIGHT_BROWSERS_PATH: ${{ runner.tool_cache }}/renderdiff-ms-playwright
      run: |
        npm ci --omit=dev --ignore-scripts --no-audit --no-fund
        npx playwright install --with-deps chromium

    - id: run
      shell: bash
      env:
        PLAYWRIGHT_BROWSERS_PATH: ${{ runner.tool_cache }}/renderdiff-ms-playwright
        CLI: ${{ github.action_path }}/src/cli.ts
        LEFT: ${{ inputs.left }}
        RIGHT: ${{ inputs.right }}
        ROUTES: ${{ inputs.routes }}
        CONFIG: ${{ inputs.config }}
        WIDTHS: ${{ inputs.widths }}
        THRESHOLD: ${{ inputs.threshold }}
        CONCURRENCY: ${{ inputs.concurrency }}
        STORAGE_STATE: ${{ inputs.storage-state }}
        ACCEPT: ${{ inputs.accept }}
        TIMEOUT: ${{ inputs.wait-timeout }}
        OUT: ${{ inputs.out }}
        ARTIFACT: ${{ inputs.artifact-name }}
      run: |
        echo "results=$OUT/results.json" >> "$GITHUB_OUTPUT"
        log="$RUNNER_TEMP/renderdiff-$ARTIFACT.txt"
        : > "$log"
        code=0

        if ! [[ "$TIMEOUT" =~ ^[0-9]+$ ]]; then
          echo "wait-timeout must be whole seconds, got '$TIMEOUT'" | tee "$log"
          code=2
        else
          end=$((SECONDS + TIMEOUT))
          until status=$(curl -s --max-time 10 -o /dev/null -w '%{http_code}' "$LEFT") && [ "$status" -gt 0 ] && [ "$status" -lt 500 ]; do
            if [ "$SECONDS" -ge "$end" ]; then
              echo "$LEFT did not answer within ${TIMEOUT}s" | tee "$log"
              code=2
              break
            fi
            sleep 5
          done
        fi

        if [ "$code" = 0 ]; then
          args=("--left=$LEFT" "--right=$RIGHT" "--out=$OUT" --no-progress)
          read -ra routes <<< "$(echo "$ROUTES" | tr '\n' ' ')"
          args+=("${routes[@]}")
          for w in ${WIDTHS//,/ }; do args+=("--width=$w"); done
          [ -n "$CONFIG" ] && args+=("--config=$CONFIG")
          [ -n "$THRESHOLD" ] && args+=("--threshold=$THRESHOLD")
          [ -n "$CONCURRENCY" ] && args+=("--concurrency=$CONCURRENCY")
          [ -n "$ACCEPT" ] && args+=("--accept=$ACCEPT")
          if [ -n "$STORAGE_STATE" ]; then
            state="$RUNNER_TEMP/renderdiff-state-$ARTIFACT.json"
            (umask 077; printf '%s' "$STORAGE_STATE" > "$state")
            args+=("--storage-state=$state")
          fi

          set +e
          node "$CLI" "${args[@]}" 2>&1 | tee "$log"
          code=${PIPESTATUS[0]}
          set -e
          rm -f "${state:-}"

          accepted="$(dirname "${CONFIG:-./_}")/renderdiff.accepted.json"
          if [ -n "$ACCEPT" ] && [ -f "$accepted" ] && [ -d "$OUT" ]; then cp "$accepted" "$OUT/"; fi
        fi
        echo "exit-code=$code" >> "$GITHUB_OUTPUT"

        case $code in
          0) verdict="✅ No visual change" ;;
          1) verdict="❌ Visual change" ;;
          2) verdict="⚠️ Bad input or an origin is down" ;;
          *) verdict="⚠️ A route errored or the run crashed" ;;
        esac
        {
          echo "### renderdiff: $verdict"
          echo
          echo "\`$LEFT\` (your change) vs \`$RIGHT\` (reference). Report, results.json and crops are in the \`$ARTIFACT\` artifact."
          echo
          echo '```text'
          head -c 900000 "$log"
          echo '```'
        } >> "$GITHUB_STEP_SUMMARY"

    - if: always() && steps.run.outcome == 'success'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ inputs.out }}
        if-no-files-found: ignore
        retention-days: 14

    - if: steps.run.outputs.exit-code != '0'
      shell: bash
      env:
        CODE: ${{ steps.run.outputs.exit-code }}
      run: exit "$CODE"
